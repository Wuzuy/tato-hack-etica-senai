name: tato
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^3.8.3
  #google_generative_ai: ^0.5.0
  flutter_map: ^6.1.0 # Use a versão mais recente
  latlong2: ^0.9.1 # Use a versão mais recente
  shared_preferences: ^2.2.2  # Armazena dados simples no dispositivo (primeiro acesso, etc).
