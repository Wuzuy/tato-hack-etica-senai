  geocoding: ^2.1.1 # Converte endereços de texto em coordenadas geográficas.

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
     - images/